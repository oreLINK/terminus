# Tests à chaque push sur dev, sur chaque pull request vers main, et à la demande (l'Action « Données du
# réseau » les lance ainsi sur la branche data-refresh : leur résultat s'affiche sur sa pull request).
# Le job « Tests » peut être exigé par la règle de protection de main.
name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # aucune dépendance npm, rien à mettre en cache
      - run: npm test
